<title id="title">IWR1843 FMCW signal path and accessible complex samples</title><desc id="desc">One transmitter and receiver branch. A common chirp engine supplies transmitted RF and the mixer local oscillator. The analogue mixer output passes through IF filtering and ADC to digital capture; DSP processing is a separate branch.</desc>
